interface:
  display_name: "Video Summary"
  short_description: "Turn raw travel clips into daily or trip-summary videos."
  default_prompt: "Use $video-summary to turn the user's travel clips and editing prompt into daily videos or one combined trip summary with journey flow, fun moments, titles, dates, locations, subtitles, and YouTube chapters. Infer the source path when safe and keep artifacts in the caller workspace."

policy:
  allow_implicit_invocation: true
