[project]
name = "video-summary"
version = "0.2.0"
description = "Low-memory, local-first CLI for daily travel video summaries"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.1,<2",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
video-summary = "video_summary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
